name: Suggest an SNN resource
description: Propose an independently maintained paper, tutorial, dataset or framework for review.
title: "[Resource] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Resource inclusion does not imply endorsement, license clearance or independent reproduction.
  - type: input
    id: title
    attributes:
      label: Original title
      placeholder: Name of the original source
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Original source URL
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: doi
    attributes:
      label: DOI or persistent identifier (if applicable)
  - type: dropdown
    id: record-type
    attributes:
      label: Resource type
      options:
        - Research paper
        - Framework / software
        - Dataset / benchmark
        - Tutorial / documentation
        - Community
    validations:
      required: true
  - type: input
    id: publication
    attributes:
      label: Venue and final publication year (papers only)
      placeholder: ICLR 2026 / IEEE TPAMI 2022 / Preprint only
  - type: textarea
    id: research-topics
    attributes:
      label: SNN research topics and justification
      description: State which research areas apply and why.
  - type: textarea
    id: affiliations
    attributes:
      label: Authorship and affiliation evidence (papers only)
      description: Include original publication URL and precise location. If unverified, write unknown. Do not infer author nationality.
  - type: input
    id: code
    attributes:
      label: Original source-code URL (if available)
  - type: input
    id: license
    attributes:
      label: Verified license and primary license URL (or unknown)
  - type: textarea
    id: significance
    attributes:
      label: Why this resource belongs in the SNN collection
      description: Describe its relevance and distinguish original work from third-party implementations.
    validations:
      required: true
  - type: checkboxes
    id: policies
    attributes:
      label: Verification statements
      options:
        - label: I have not claimed that SNNCommunity independently reproduced or endorsed this resource.
          required: true
