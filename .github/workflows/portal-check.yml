name: Portal checks

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/portal-check.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/portal-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/neuron-core.js
      - name: Run portal source checks
        run: node --test tests/portal.test.mjs tests/neuron-core.test.mjs tests/typography.test.mjs
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Run browser smoke tests and capture screenshots
        run: node tests/browser-smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-previews
          path: artifacts/
          if-no-files-found: ignore
