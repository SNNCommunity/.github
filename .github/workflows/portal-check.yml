name: Portal checks

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/portal-check.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/portal-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check docs/app.js
      - name: Run portal source checks
        run: node --test tests/portal.test.mjs
