name: Render social card

on:
  push:
    branches: ["feat/scientific-portal-p0-p1-p2"]
    paths:
      - "docs/og-card.svg"
      - ".github/workflows/render-social-card.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install SVG rasterizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
      - name: Render a deterministic 1200 × 630 PNG
        run: |
          rsvg-convert --width 1200 --height 630 docs/og-card.svg > docs/social-card.png
          rsvg-convert --width 512 --height 512 docs/favicon.svg > docs/avatar.png
          file docs/social-card.png docs/avatar.png
      - name: Commit the generated website image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/social-card.png docs/avatar.png
          if ! git diff --cached --quiet; then
            git commit -m "brand: publish PNG social preview from canonical vector source"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
