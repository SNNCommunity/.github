name: Synchronize canonical generated paper pages

on:
  push:
    branches:
      - fix/atlas-canonical-taxonomy-data-and-ui-20261017

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate curated paper pages
        run: node scripts/build-paper-pages.mjs
      - name: Commit deterministic generated output
        run: |
          git add docs/papers docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "Generated pages already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize curated research pages with canonical 13-domain taxonomy"
          git push origin HEAD:refs/heads/fix/atlas-canonical-taxonomy-data-and-ui-20261017
